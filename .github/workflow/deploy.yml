name: CI/CD Innovatech

on:
  push:
    [cite_start]branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Frontend
          docker build -t $REGISTRY/front-innovatech ./front_despacho
          docker push $REGISTRY/front-innovatech
          
          # Backend Despachos
          docker build -t $REGISTRY/back-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $REGISTRY/back-despachos
          
          # Backend Ventas
          docker build -t $REGISTRY/back-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $REGISTRY/back-ventas

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login en la EC2 y actualizar contenedores [cite: 112, 174]
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            cd ~/proyecto
            docker-compose pull
            docker-compose up -d