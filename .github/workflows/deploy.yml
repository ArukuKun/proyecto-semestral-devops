deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Copiar docker-compose a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/proyecto/"

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pasamos todo lo necesario para que la EC2 pueda "hablar" con AWS
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Registramos las variables que vamos a usar en el script
          envs: REGISTRY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            mkdir -p ~/proyecto
            cd ~/proyecto
            
            # Configuramos las credenciales temporalmente en la sesión de SSH
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN
            export REGISTRY=$REGISTRY

            # Ahora el login sí tendrá permisos
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REGISTRY
            
            # Limpiamos contenedores viejos y bajamos los nuevos
            docker-compose pull
            docker-compose up -d --remove-orphans