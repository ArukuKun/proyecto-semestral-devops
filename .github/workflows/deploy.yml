name: CI/CD Innovatech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v3

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/front-innovatech ./front_despacho
          docker push $REGISTRY/front-innovatech
          
          docker build -t $REGISTRY/back-despachos ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $REGISTRY/back-despachos
          
          docker build -t $REGISTRY/back-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $REGISTRY/back-ventas

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Copiar docker-compose a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/proyecto/"

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        # 1. Definimos la variable en el entorno de la Action
        env:
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 2. Le decimos a SSH que "pase" esta variable a la EC2
          envs: REGISTRY
          script: |
            mkdir -p ~/proyecto
            cd ~/proyecto
            
            # Login usando la variable inyectada
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REGISTRY
            
            # 3. Exportamos la variable para que docker-compose la vea
            export REGISTRY=$REGISTRY
            
            docker-compose pull
            docker-compose up -d --remove-orphans