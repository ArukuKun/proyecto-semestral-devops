deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # PASO CLAVE: Enviar el archivo docker-compose a la EC2
      - name: Copiar docker-compose a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/proyecto/"

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Crear carpeta si no existe
            mkdir -p ~/proyecto
            cd ~/proyecto
            
            # Login corregido (reemplaza 123456789012 con tu ID de cuenta AWS o usa la variable)
            # El ID de cuenta aparece en la URL de tu consola ECR
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # Bajar imágenes nuevas y levantar
            docker-compose pull
            docker-compose up -d