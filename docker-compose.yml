version: '3.8'

services:
  # 1. Base de datos con persistencia (IE3)
  db:
    image: mysql:8.0
    container_name: db_innovatech
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: innovatech_db
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql # Aquí está la persistencia con Named Volume
    networks:
      - app-network

  # 2. Backend de Despachos
  backend-despachos:
    build: 
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: back_despachos
    restart: on-failure
    ports:
      - "8081:8080" # Expone en el puerto 8081 del host
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/innovatech_db
      - SPRING_DATASOURCE_USERNAME=dev_user
      - SPRING_DATASOURCE_PASSWORD=dev_password
    depends_on:
      - db
    networks:
      - app-network

  # 3. Backend de Ventas
  backend-ventas:
    build: 
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: back_ventas
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      - DB_ENDPOINT=db 
      - DB_PORT=3306
      - DB_NAME=innovatech_db
      - DB_USERNAME=dev_user
      - DB_PASSWORD=dev_password
    depends_on:
      - db
    networks:
      - app-network

  # 4. Frontend
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: front_innovatech
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend-despachos
      - backend-ventas
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: